# Coverage is reported per module, because they are separate modules with
# separate release cadences: `core` is impl/go, `kvs` is
# impl/go/integrations/kvs.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      core:
        flags: [core]
        target: auto
        threshold: 1%
      kvs:
        flags: [kvs]
        target: auto
        threshold: 1%
    # A patch is informational. A change that lowers overall coverage is worth
    # a comment; a single uncovered line in a new file is not worth a red X.
    patch:
      default:
        informational: true

flags:
  core:
    paths:
      - impl/go/
  kvs:
    paths:
      - impl/go/integrations/kvs/

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  # Generated corpus and the tool that writes it: covered by the CI job that
  # regenerates them and asserts the tree is unchanged, not by line coverage.
  - "impl/go/internal/kvsgen/genfixtures/**"
