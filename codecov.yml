# Coverage is reported per module, because they are separate modules with
# separate release cadences: `core` is impl/go, `kvs` is
# impl/go/integrations/kvs.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      core:
        flags: [core]
        target: auto
        threshold: 1%
      kvs:
        flags: [kvs]
        target: auto
        threshold: 1%
    # A patch is informational. A change that lowers overall coverage is worth
    # a comment; a single uncovered line in a new file is not worth a red X.
    patch:
      default:
        informational: true

flags:
  core:
    paths:
      - impl/go/
  kvs:
    paths:
      - impl/go/integrations/kvs/

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

# Nothing is ignored. The measurement is made honest in CI instead, by giving
# `go test` -coverpkg=./... so a package is credited for the code its tests
# actually run: the helper packages the suite leans on hardest had no tests of
# their own and so scored 0.0%, which an ignore list would have hidden rather
# than fixed.
