name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dir: impl/go
            flag: core
          - name: integrations/kvs
            dir: impl/go/integrations/kvs
            flag: kvs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          # Both modules have zero third-party requires, so there is no go.sum
          # for setup-go to key a module cache on. The build cache below is what
          # is actually worth keeping.
          cache: false

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ matrix.flag }}-${{ hashFiles(format('{0}/**/*.go', matrix.dir)) }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ matrix.flag }}-

      - name: Vet
        run: go vet ./...
        working-directory: ${{ matrix.dir }}

      # -coverpkg=./... credits a package for the code its tests actually run,
      # not just for the code its own tests declare. internal/ebmltest,
      # internal/kvsgen and internal/ebmltrace have no tests of their own and
      # are exercised by every other package, so the default measurement scored
      # them 0.0% and reported the module 11 points below what the suite covers.
      # The flag is module-scoped, so the core module's code is still not
      # credited to the kvs flag.
      - name: Test
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
        working-directory: ${{ matrix.dir }}

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.dir }}/coverage.out
          flags: ${{ matrix.flag }}
          fail_ci_if_error: true

  # The jobs above run under the root go.work, which resolves the core from the
  # tree. That is what a contributor wants and exactly what a CONSUMER does not
  # get: they see integrations/kvs's requirement and nothing else. This job
  # builds it the way they resolve it, so a requirement that only works inside
  # the workspace -- which is what `replace` amounted to -- fails here.
  published-resolution:
    name: kvs resolves as published
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: impl/go/integrations/kvs/go.mod
          cache: false

      - name: Build and test against the required core
        run: go test ./...
        working-directory: impl/go/integrations/kvs

      - name: Assert go.mod and go.sum are already tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
        working-directory: impl/go/integrations/kvs

  fixtures:
    name: corpus is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: impl/go/go.mod
          cache: false

      # The committed corpus is generated, and it is generated through the
      # public writer. Regenerating it must produce the bytes already in the
      # tree: a corpus that cannot be reproduced from the library is a corpus
      # nothing keeps honest.
      - name: Regenerate fixtures and goldens
        run: go run ./internal/kvsgen/genfixtures
        working-directory: impl/go

      - name: Assert the tree is unchanged
        run: git diff --exit-code -- fixtures golden
